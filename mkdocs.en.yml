# English documentation: same site as mkdocs.yml, built from docs-en/ into site/en/ (after the French one).
INHERIT: mkdocs.yml
site_description: A Minecraft Bedrock server in C# / .NET 10, coded by AI (and a bit of human)
site_url: https://nexiumpvp2.github.io/bedrokia/en/
docs_dir: docs-en
site_dir: site/en
edit_uri: edit/main/docs-en/
copyright: Bedrokia · Apache 2.0 · Not affiliated with Mojang or Microsoft

theme:
  language: en

plugins:
  - search:
      lang: en
  - awesome-nav

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Nexiumpvp2/bedrokia
      name: Source code
    - icon: material/download
      link: https://github.com/Nexiumpvp2/bedrokia/releases/latest
      name: Latest version
