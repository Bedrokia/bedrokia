name: Discord

# Styled update messages in Discord. Releases and CI failures are announced from ci.yml.
on:
  push:
    branches: [main]

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/discord/notify.mjs push
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
